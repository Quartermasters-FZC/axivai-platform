services:
  # MySQL Database (matches Hostinger production)
  db:
    image: mysql:8.4
    container_name: axivai-db
    restart: unless-stopped
    environment:
      MYSQL_USER: axivai
      MYSQL_PASSWORD: axivai_dev_password
      MYSQL_DATABASE: axivai
      MYSQL_ROOT_PASSWORD: axivai_dev_root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u axivai -paxivai_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Next.js Application (Development)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: axivai-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=mysql://axivai:axivai_dev_password@db:3306/axivai
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

volumes:
  mysql_data:
