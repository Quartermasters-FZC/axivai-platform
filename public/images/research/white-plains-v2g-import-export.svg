<g id="source-footer"><text x="66" y="846" font-family="Inter, Arial, sans-serif" font-size="14" fill="#57534E">The 55% figure comes from a secondary case study and may not use the same definition as the plan’s 95% target.</text><line x1="66" y1="857" x2="1533" y2="857" stroke="#E8E4DC" stroke-width="1.5"/><text x="66" y="884" font-family="Inter, Arial, sans-serif" font-size="16" fill="#57534E">Con Edison findings (2022); pilot plan filed with NY PSC (2018); Ecology Action Centre case study.</text></g>
