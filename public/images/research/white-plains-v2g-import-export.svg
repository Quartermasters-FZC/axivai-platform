<?xml version="1.0" encoding="UTF-8"?>
<svg data-chapters='[{"t": 0.5, "label": "Overnight: charging"}, {"t": 6.4, "label": "Summer, 1–7 pm: export"}]' data-duration="12.4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
<title id="title">TWO DIFFERENT CONNECTIONS</title>
<desc id="desc">A bus depot connected to a utility pole and transformer by two arrows. Import, power coming in, happens overnight while buses charge: the depot&#8217;s problem is not enough capacity to charge the fleet, and the fixes to compare are managed charging, a utility upgrade, an on-site battery and delivered energy. Export through vehicle-to-grid happened in summer from 1 to 7 pm: the White Plains pilot planned 15 kW per bus with 3 of 5 buses fitted; 85% of discharged energy reached the grid; buses were available on about 55% of scheduled export days; export ended without an interconnection agreement. V2G does not add import capacity.</desc>
